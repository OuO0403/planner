<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>我的規劃板</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="規劃板" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#EFE8DC" />
<style>
  :root{
    --bg:#EFE8DC; --surface:#FFFDF9; --ink:#21231E; --sub:#6E7268; --line:#E3DCCD; --faint:#F3EEE4; --done:#ABACA2;
    --now:#DB4D34; --routine:#4E63B6; --timed:#C98A2B; --someday:#4F977E;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#F4EFE6 0%,#EAE3D6 100%);background-attachment:fixed;
    padding-bottom:calc(94px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;}
  .strip{display:flex;height:5px;}
  .strip>div{flex:1;}
  header{padding:22px 20px 16px;}
  .eyebrow{font-family:var(--mono);font-size:11px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line);}
  .date{font-family:var(--mono);font-size:12px;color:var(--sub);letter-spacing:1px;}
  h1{margin:4px 0 2px;font-size:26px;font-weight:800;letter-spacing:-.6px;}
  .tag{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.5;}
  .bar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--line);box-shadow:inset 0 1px 2px rgba(0,0,0,.04);}
  .legend{display:flex;gap:14px;margin-top:9px;font-family:var(--mono);font-size:11.5px;color:var(--sub);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  section{padding:6px 16px;}
  .row{display:flex;gap:8px;}
  input.inp,textarea.inp,select.inp{width:100%;flex:1;min-width:0;padding:12px 14px;font-size:15px;
    border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--ink);outline:none;font-family:inherit;}
  textarea.inp{resize:vertical;min-height:96px;line-height:1.6;}
  input.inp:focus,textarea.inp:focus,select.inp:focus{border-color:var(--sub);box-shadow:0 0 0 3px rgba(110,114,104,.08);}
  .btn{padding:12px 18px;font-size:14.5px;font-weight:700;border:none;border-radius:13px;
    background:var(--ink);color:#fff;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .btn.ghost{background:var(--surface);color:var(--sub);border:1px solid var(--line);font-weight:600;}
  .btn:active,.chip:active,.navbtn:active,.expchip:active{transform:scale(.97);}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px;}
  .chip{padding:8px 15px;font-size:13px;font-weight:700;border:1px solid var(--line);
    border-radius:99px;background:var(--surface);color:var(--sub);cursor:pointer;white-space:nowrap;font-family:inherit;}
  .card{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border-radius:14px;
    padding:14px 13px 14px 13px;margin-bottom:9px;border:1px solid rgba(227,220,205,.7);
    box-shadow:0 2px 6px rgba(60,50,30,.05);transition:opacity .2s,transform .1s;}
  .card.done{opacity:.5;}
  .check{flex-shrink:0;width:22px;height:22px;border-radius:7px;border:2px solid;display:flex;
    align-items:center;justify-content:center;cursor:pointer;margin-top:1px;background:transparent;color:#fff;font-size:13px;}
  .ttext{font-size:15px;line-height:1.4;}
  .card.done .ttext{text-decoration:line-through;color:var(--done);}
  .cattag{font-family:var(--mono);font-size:11px;margin-top:7px;background:none;border:none;padding:0;cursor:pointer;display:block;}
  .catpick{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
  .catpick button{font-size:12px;font-weight:700;color:#fff;border:none;border-radius:8px;padding:6px 11px;cursor:pointer;}
  .del{flex-shrink:0;background:none;border:none;color:#D6CEBE;font-size:14px;cursor:pointer;padding:3px 5px;}
  .del:hover{color:var(--now);}
  .empty{text-align:center;color:var(--sub);font-size:14px;padding:44px 24px;line-height:1.7;
    background:var(--faint);border:1px dashed var(--line);border-radius:14px;}
  .hint{font-size:13px;color:var(--sub);padding:0 0 12px;line-height:1.5;}
  /* week */
  .gridscroll{overflow-x:auto;margin:0 -16px;padding:0 16px;}
  .grid{min-width:560px;display:grid;grid-template-columns:48px repeat(7,1fr);gap:5px;}
  .hgrid{min-width:560px;display:grid;grid-template-columns:44px repeat(7,minmax(66px,1fr));gap:4px;}
  .dayhead{text-align:center;font-size:13px;font-weight:800;padding:6px 0;}
  .slothead{font-family:var(--mono);font-size:10.5px;color:var(--sub);display:flex;align-items:center;justify-content:center;text-align:center;}
  .cell{min-height:0;border:1px solid var(--line);border-radius:9px;background:var(--surface);
    font-size:11px;line-height:1.2;padding:4px 4px;cursor:pointer;text-align:center;word-break:break-word;
    display:flex;align-items:center;justify-content:center;font-family:inherit;color:var(--ink);overflow:hidden;}
  .cell.empty-cell{color:#D6CEBE;border-style:dashed;}
  /* month + 帳本 cards */
  .statcard{background:var(--surface);border-radius:16px;padding:18px;border:1px solid rgba(227,220,205,.7);
    box-shadow:0 2px 8px rgba(60,50,30,.05);margin-top:4px;}
  .statcard .row1{display:flex;justify-content:space-between;align-items:baseline;}
  .bignum{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-1px;}
  .unit{font-family:var(--mono);font-size:13px;color:var(--sub);}
  .prog{height:7px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden;}
  .prog>div{height:100%;background:var(--now);transition:width .3s;}
  .catbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:14px;}
  /* daily date nav */
  .datenav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);
    border:1px solid var(--line);border-radius:13px;padding:6px;margin-bottom:14px;}
  .datenav button{background:none;border:none;font-size:20px;color:var(--sub);cursor:pointer;padding:6px 16px;font-family:inherit;}
  .datenav .cur{font-family:var(--mono);font-size:14px;font-weight:700;}
  .today-btn{font-family:var(--mono);font-size:11px;color:var(--routine);cursor:pointer;background:none;border:none;}
  /* expense */
  .expchips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;margin-bottom:8px;}
  .expchip{display:flex;align-items:center;gap:5px;padding:7px 12px;font-size:13px;font-weight:600;
    border:1.5px solid var(--line);border-radius:99px;background:var(--surface);color:var(--sub);cursor:pointer;white-space:nowrap;font-family:inherit;}
  .expchip i{width:9px;height:9px;border-radius:99px;display:inline-block;}
  .exprow{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:12px;
    padding:12px 13px;margin-bottom:8px;border:1px solid rgba(227,220,205,.7);box-shadow:0 1px 4px rgba(60,50,30,.04);}
  .exprow .amt{font-family:var(--mono);font-weight:700;font-size:15px;margin-left:auto;}
  .seclabel{font-size:13px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:7px;}
  .seclabel .r{margin-left:auto;font-family:var(--mono);font-weight:600;color:var(--sub);font-size:12px;}
  .duechip{display:inline-block;margin-left:7px;font-size:10.5px;font-weight:700;font-family:var(--mono);padding:1px 7px;border-radius:99px;vertical-align:middle;}
  .duechip.over{background:#DB4D3420;color:#C23A22;}
  .duechip.today{background:#C98A2B22;color:#A6701C;}
  .duechip.soon{background:#4E63B61C;color:#3D4F9E;}
  .duechip.future{background:var(--faint);color:var(--sub);}
  .todaybox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(60,50,30,.05);}
  .todorow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--faint);}
  .todorow .tx{flex:1;min-width:0;font-size:14.5px;cursor:pointer;}
  .todorow.over .tx{color:#C23A22;}
  .tcheck{flex-shrink:0;width:22px;height:22px;border-radius:7px;border:2px solid var(--someday);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
  .linkbtn{background:none;border:none;color:var(--routine);font-family:var(--mono);font-size:12px;cursor:pointer;padding:8px 0 2px;}
  .calgrid-head{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:6px 0 4px;}
  .calgrid-head div{text-align:center;font-size:11px;color:var(--sub);font-weight:700;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .calcell{min-height:56px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;padding:3px;display:flex;flex-direction:column;align-items:stretch;overflow:hidden;font-family:inherit;}
  .calcell.today{border-color:var(--now);}
  .calcell.sel{background:#21231E;border-color:#21231E;}
  .caldate{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--sub);text-align:left;}
  .calcell.today .caldate{color:var(--now);}
  .calcell.sel .caldate{color:#fff;}
  .calchip{font-size:8.5px;line-height:1.25;background:var(--faint);border-radius:4px;padding:1px 3px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;}
  .calcell.sel .calchip{background:rgba(255,255,255,.22);color:#fff;}
  .calmore{font-size:8px;color:var(--sub);margin-top:1px;text-align:left;}
  .calcell.sel .calmore{color:rgba(255,255,255,.7);}
  /* sheet / overlay */
  .sheetbg{position:fixed;inset:0;background:rgba(25,22,16,.42);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;backdrop-filter:blur(2px);}
  .sheet{width:100%;max-width:560px;background:var(--bg);border-radius:22px 22px 0 0;
    padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease;max-height:80vh;overflow-y:auto;}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet .lbl{font-family:var(--mono);font-size:12px;color:var(--sub);}
  .picklist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .pickitem{font-size:12.5px;border:1px solid;border-radius:9px;background:var(--surface);color:var(--ink);
    padding:7px 11px;cursor:pointer;text-align:left;max-width:100%;font-family:inherit;}
  /* confirm dialog */
  .dlgbg{position:fixed;inset:0;background:rgba(25,22,16,.42);display:flex;align-items:center;
    justify-content:center;z-index:60;padding:24px;backdrop-filter:blur(2px);}
  .dlg{background:var(--surface);border-radius:18px;padding:22px 20px;max-width:320px;width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,.2);animation:pop .18s ease;}
  @keyframes pop{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
  #toast{position:fixed;left:0;right:0;bottom:84px;display:flex;justify-content:center;z-index:70;pointer-events:none;padding-bottom:env(safe-area-inset-bottom);}
  #toast .t{background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:99px;
    box-shadow:0 8px 24px rgba(0,0,0,.22);opacity:0;transform:translateY(8px);transition:opacity .22s,transform .22s;max-width:80%;text-align:center;}
  #toast .t.show{opacity:1;transform:translateY(0);}
  .blob{width:52px;height:52px;flex-shrink:0;animation:blobidle 3.8s ease-in-out infinite;transform-origin:50% 80%;}
  .blob.mood-happy{animation:happybob 2.6s ease-in-out infinite;}
  .blob.mood-excited{animation:excitedjump .55s ease-in-out infinite;}
  .blob.mood-sleepy{animation:sleepynod 4.6s ease-in-out infinite;}
  @keyframes blobidle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes happybob{0%,100%{transform:translateY(0)}25%{transform:translateY(-4px) scaleY(.97)}50%{transform:translateY(0)}}
  @keyframes excitedjump{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7px) rotate(-5deg)}50%{transform:translateY(0)}75%{transform:translateY(-4px) rotate(5deg)}}
  @keyframes sleepynod{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(1.5px) rotate(2.5deg)}}
  .eyeblink{transform-box:fill-box;transform-origin:center;animation:blobblink 10s ease-in-out infinite;}
  @keyframes blobblink{
    0%,28%{transform:scaleY(1)} 30%{transform:scaleY(.1)} 32%{transform:scaleY(1)}
    56%{transform:scaleY(1)} 58%{transform:scaleY(.1)} 60%{transform:scaleY(1)}
    86%{transform:scaleY(1)} 87.5%{transform:scaleY(.1)} 89%{transform:scaleY(1)} 90.5%{transform:scaleY(.1)} 92%{transform:scaleY(1)}
    100%{transform:scaleY(1)} }
  .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.1s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
  .zzz{animation:zfloat 2.6s ease-in-out infinite;opacity:0;}
  @keyframes zfloat{0%{opacity:0;transform:translate(0,0) scale(.7)}25%{opacity:.85}100%{opacity:0;transform:translate(4px,-13px) scale(1.1)}}
  .dlg h3{margin:0 0 6px;font-size:17px;}
  .dlg p{margin:0 0 18px;font-size:13.5px;color:var(--sub);line-height:1.5;word-break:break-word;}
  .dlg .row{gap:10px;}
  .dlg .btn{flex:1;}
  .btn.danger{background:var(--now);}
  /* nav */
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;
    background:linear-gradient(transparent,#EAE3D6 36%);padding-bottom:env(safe-area-inset-bottom);}
  .navinner{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:99px;
    padding:5px;margin:10px 0 14px;box-shadow:0 6px 24px rgba(60,50,30,.13);}
  .navsep{width:1px;align-self:stretch;background:var(--line);margin:5px 4px;}
  .navbtn{position:relative;padding:9px 12px;font-size:13.5px;border:none;background:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--sub);font-family:inherit;font-weight:600;}
  .navbtn.on{color:var(--ink);font-weight:800;}
  .navbtn.rec.on{color:#3C7A64;}
  .navdot{width:5px;height:5px;border-radius:99px;background:var(--now);}
  .navbtn.rec .navdot{background:#4F977E;}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--routine);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  @media (min-width:768px){
    body{zoom:1.18;}
    .wrap{max-width:640px;}
  }
  @media (min-width:1100px){
    body{zoom:1.3;}
  }
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<div class="wrap">
  <header id="header"></header>
  <div id="view"></div>
</div>
<nav id="nav"></nav>
<div id="overlay"></div>
<div id="dialog"></div>
<div id="toast"></div>

<script>
/* ---------- storage ---------- */
const LS = (() => {
  try { const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return localStorage; }
  catch(e){ const m={}; return { getItem:k=>k in m?m[k]:null, setItem:(k,v)=>{m[k]=String(v)}, removeItem:k=>{delete m[k]} }; }
})();

/* ---------- 分類 = 顏色語言 ---------- */
const CATS = {
  now:{label:"先做",color:"var(--now)"}, routine:{label:"定期",color:"var(--routine)"},
  timed:{label:"某時期",color:"var(--timed)"}, someday:{label:"有空",color:"var(--someday)"},
};
const CAT_ORDER = ["now","routine","timed","someday"];
const DEF_EXP = [
  {key:"food",label:"飲食",color:"#DB4D34"},
  {key:"trans",label:"交通",color:"#4E63B6"},
  {key:"fun",label:"娛樂",color:"#C98A2B"},
  {key:"study",label:"學習",color:"#4F977E"},
  {key:"life",label:"生活",color:"#8A6FB0"},
  {key:"other",label:"其他",color:"#6E7268"},
];
const DEF_INC = [
  {key:"job",label:"打工",color:"#4F977E"},
  {key:"bonus",label:"獎金",color:"#C98A2B"},
  {key:"family",label:"家裡",color:"#4E63B6"},
  {key:"iother",label:"其他",color:"#6E7268"},
];
const CAT_PALETTE = ["#DB4D34","#4E63B6","#C98A2B","#4F977E","#8A6FB0","#5FA38B","#C56A8E","#6E7268"];
const BLOB_PALETTE = ["#7CB6A0","#3FA9A0","#5B8DD6","#5B63C4","#8A6FB0","#C56A8E","#E87DA8","#E8553D","#E8915C","#E0B23B","#9DC36A","#5A5F57"];
const TASK_EMOJI = ["📌","✅","🎓","📚","✍️","💪","🏃","🧘","🎨","🎮","🎵","🍳","🧹","🛒","💰","💸","✈️","🎁","📷","🐾","🌱","💊","🦷","📝","💡","❤️","⭐","🔔"];
function dueInfo(due){
  if(!due) return null;
  const t=todayStr();
  if(due<t) return {cls:"over",label:"逾期"};
  if(due===t) return {cls:"today",label:"今天"};
  if(due===addDays(t,1)) return {cls:"soon",label:"明天"};
  return {cls:"future",label:`${+due.slice(5,7)}/${+due.slice(8,10)}`};
}
function timeLabel(t){
  if(t.start&&t.end) return `${t.start}–${t.end}`;
  if(t.start) return t.start;
  if(t.end) return `～${t.end}`;
  return "";
}
function timeKey(t){ return t.start||t.end||"99:99"; }
const catList = type => (state.cats[type==="income"?"income":"expense"]);
const catOf = e => (catList(e.type==="income"?"income":"expense").find(c=>c.key===e.cat)) || {label:"其他",color:"#6E7268"};
const signed = n => (n>=0?"+":"−") + "NT$ " + Math.abs(Math.round(n)).toLocaleString();
const DAYS = ["一","二","三","四","五","六","日"];
const START_HOUR=6, END_HOUR=23;
const HOURS=[];for(let h=START_HOUR;h<=END_HOUR;h++)HOURS.push(h);
const hpad=h=>String(h).padStart(2,"0");
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nt = n => "NT$ " + Math.round(n).toLocaleString();

/* date helpers (local) */
function toStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayStr(){return toStr(new Date());}
function addDays(str,n){const[y,m,d]=str.split("-").map(Number);const dt=new Date(y,m-1,d+n);return toStr(dt);}
function addMonths(ym,n){const[y,m]=ym.split("-").map(Number);const dt=new Date(y,m-1+n,1);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");}
function fmtDate(str){const[y,m,d]=str.split("-").map(Number);const dt=new Date(y,m-1,d);
  return `${y}.${String(m).padStart(2,"0")}.${String(d).padStart(2,"0")} 週${"日一二三四五六"[dt.getDay()]}`;}

/* ---------- 預設清單 ---------- */
const SEED = [];

/* ---------- 狀態 ---------- */
const load=(k,f)=>{try{const v=LS.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}};
const CURMON=todayStr().slice(0,7);
function loadMonthGoals(){
  const mg=load("pl-mgoals",null);
  if(mg) return mg;
  const old=load("pl-month",null); // 舊版資料若有則沿用
  return old?{[CURMON]:old}:{};
}
let state = {
  tab:"list",
  tasks:load("pl-tasks",SEED),
  week:load("pl-week",{}),
  monthGoals:loadMonthGoals(),
  expenses:load("pl-exp",[]),
  journal:load("pl-journal",{}),
  cats:load("pl-cats",{expense:DEF_EXP.slice(),income:DEF_INC.slice()}),
  blobColor:load("pl-blob","#7CB6A0"),
};
let ui={filter:"all",picking:null,cell:null,cellVal:"",cellEnd:0,monthPicker:false,
        day:todayStr(),planMonth:CURMON,planPick:false,planPickYear:0,
        entryType:"expense",expCat:"food",incCat:"job",
        expAmount:"",expNote:"",confirm:null,journalView:false,journalMonth:"",journalPick:false,journalPickYear:0,

const DAYSEED=parseInt(todayStr().replace(/-/g,""),10)||0;
function greetLine(){
  const h=new Date().getHours();
  const sets=h<5?["夜深了","還沒睡呀","早點休息喔"]
    :h<11?["早安","早安啊","新的一天","起床啦"]
    :h<14?["午安","中午了","午安啊"]
    :h<18?["下午好","下午啦","嗨"]
    :h<23?["晚安","晚上好","辛苦了","今天還順利嗎"]
    :["夜深了","還沒睡呀","早點休息喔"];
  const opener=sets[DAYSEED%sets.length];
  const parts=[];
  const goals=goalsOf(CURMON), left=goals.filter(x=>!x.done).length;
  if(goals.length) parts.push(left===0?"本月計畫都完成了 🎉":`本月還有 ${left} 件`);
  const td=todayStr();
  const spent=state.expenses.filter(e=>e.date===td&&e.type!=="income").reduce((a,e)=>a+e.amount,0);
  if(spent>0) parts.push(`今天花了 ${nt(spent)}`);
  return parts.length?`${opener}，${parts.join(" · ")}`:`${opener}，想做什麼就丟進來吧`;
}
function blobMood(){
  if(_blobReacting) return "excited";
  const h=new Date().getHours();
  if(h<5||h>=23) return "sleepy";
  const goals=goalsOf(CURMON);
  if((goals.length&&goals.every(g=>g.done)) || h<11) return "happy";
  return "content";
}
function lighten(hex,amt){
  const m=/^#?([0-9a-f]{6})$/i.exec((hex||"").trim());
  if(!m) return hex||"#7CB6A0";
  const n=parseInt(m[1],16);let r=n>>16,g=(n>>8)&255,b=n&255;
  r=Math.round(r+(255-r)*amt);g=Math.round(g+(255-g)*amt);b=Math.round(b+(255-b)*amt);
  return `rgb(${r},${g},${b})`;
}

function renderWeek(){

  // 角落 + 星期表頭
  DAYS.forEach((d,di)=>{ const t=di===todayDi; items+=`<div class="dayhead" style="grid-column:${di+2};grid-row:1;color:${t?'var(--now)':'var(--ink)'}">${d}${t?'<div style="font-family:var(--mono);font-size:9px;font-weight:700;color:var(--now);margin-top:1px">今天</div>':''}</div>`; });
  // 時間欄
  HOURS.forEach((h,hi)=>{ items+=`<div class="slothead" style="grid-column:1;grid-row:${hi+2}">${hpad(h)}</div>`; });
  // 每天逐欄處理，合併連續相同的內容
  for(let di=0;di<7;di++){
    let hi=0;
    while(hi<nH){
      const v=state.week[`${di}-${HOURS[hi]}`]||"";
      if(v===""){
        items+=`<button class="cell empty-cell" data-act="cell" data-day="${di}" data-h0="${HOURS[hi]}" data-span="1" style="grid-column:${di+2};grid-row:${hi+2}">+</button>`;
        hi++;
      } else {
        let hj=hi;
        while(hj+1<nH && (state.week[`${di}-${HOURS[hj+1]}`]||"")===v) hj++;
        const span=hj-hi+1;
        items+=`<button class="cell" data-act="cell" data-day="${di}" data-h0="${HOURS[hi]}" data-span="${span}" style="grid-column:${di+2};grid-row:${hi+2}/span ${span}">${esc(v)}</button>`;
        hi=hj+1;
      }
    }
  }
  document.getElementById("view").innerHTML=`<section>
    <div class="eyebrow">週計畫 · week</div>
    <p class="hint">每個小時排要做什麼，連續同一件事會自動併成一格。點格子填入或從清單挑。</p>

      ${items}
    </div></div>
  </section>`;
}

function trendChart(selMon){
  const Y=selMon.slice(0,4);
  const months=[];
  for(let mm=1;mm<=12;mm++) months.push(`${Y}-${String(mm).padStart(2,"0")}`);
  const data=months.map(ym=>{
    const es=state.expenses.filter(e=>e.date.slice(0,7)===ym);
    return {ym,
      inc:es.filter(e=>e.type==="income").reduce((a,e)=>a+e.amount,0),
      exp:es.filter(e=>e.type!=="income").reduce((a,e)=>a+e.amount,0)};
  });
  if(!data.some(d=>d.inc||d.exp)) return `<div class="statcard" style="margin-top:12px">
    <div class="row1"><div style="font-size:14px;color:var(--sub);font-weight:600">${Y}年每月收支趨勢</div></div>
    <div class="empty" style="margin-top:12px;padding:24px">${Y} 年記幾筆之後，這裡會出現整年的收支對比。</div></div>`;
  const pmw=46, H=150, top=12, bot=H-30, usable=bot-top, W=pmw*12;
  const maxV=Math.max(1,...data.flatMap(d=>[d.inc,d.exp]));
  const barW=Math.min(13,pmw*0.26), gap=Math.max(2,barW*0.3);
  const bars=data.map((d,i)=>{
    const cx=i*pmw+pmw/2;
    const incH=d.inc/maxV*usable, expH=d.exp/maxV*usable;
    const mm=+d.ym.slice(5);
    const selBg=d.ym===selMon?`<rect x="${i*pmw+1}" y="${top-4}" width="${pmw-2}" height="${bot-top+4}" rx="4" fill="#21231E" opacity="0.06"/>`:"";
    const incBar=d.inc>0?`<rect x="${cx-barW-gap/2}" y="${bot-incH}" width="${barW}" height="${Math.max(1,incH)}" rx="2" fill="#4F977E"/>`:"";
    const expBar=d.exp>0?`<rect x="${cx+gap/2}" y="${bot-expH}" width="${barW}" height="${Math.max(1,expH)}" rx="2" fill="#DB4D34"/>`:"";
    const lbl=`<text x="${cx}" y="${H-12}" font-size="11" font-family="ui-monospace,monospace" fill="${d.ym===selMon?'#21231E':'#6E7268'}" text-anchor="middle">${mm}月</text>`;
    const hit=`<rect x="${i*pmw}" y="0" width="${pmw}" height="${H}" fill="transparent" data-act="monthjump" data-date="${d.ym}-01" style="cursor:pointer"/>`;
    return selBg+incBar+expBar+lbl+hit;
  }).join("");
  return `<div class="statcard" style="margin-top:12px">
    <div class="row1"><div style="font-size:14px;color:var(--sub);font-weight:600">${Y}年每月收支趨勢</div>
      <div class="unit" style="font-size:11px">綠收入 紅支出</div></div>
    <div id="trendScroll" style="overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch">
      <svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;display:block">
        <line x1="0" y1="${bot}" x2="${W}" y2="${bot}" stroke="#E3DCCD" stroke-width="1"/>
        ${bars}
      </svg>
    </div>
    <div style="font-family:var(--mono);font-size:11px;color:var(--sub);margin-top:4px">左右滑動看整年 · 點月份可切到那個月</div>
  </div>`;
}

function renderDaily(){
  const day=ui.day, mon=day.slice(0,7);
  const monAll=state.expenses.filter(e=>e.date.slice(0,7)===mon);

  const sum=arr=>arr.reduce((a,e)=>a+e.amount,0);
  const monInc=sum(monAll.filter(e=>e.type==="income")), monExp=sum(monAll.filter(e=>e.type!=="income"));
  const dayInc=sum(dayAll.filter(e=>e.type==="income")), dayExp=sum(dayAll.filter(e=>e.type!=="income"));
  const net=monInc-monExp;
  const totalBal=state.expenses.reduce((a,e)=>a+(e.type==="income"?e.amount:-e.amount),0);
  const byCat=catList("expense").map(c=>({...c,s:sum(monAll.filter(e=>e.type!=="income"&&e.cat===c.key))})).filter(c=>c.s>0);
  const expT=monExp||1;
  const note=state.journal[day]||"";
  const isToday=day===todayStr();
  const isInc=ui.entryType==="income";
  const cats=catList(ui.entryType);
  const curCat=isInc?ui.incCat:ui.expCat;
  const trendHTML=trendChart(mon);

  document.getElementById("view").innerHTML=`<section>
    <div class="eyebrow">帳本 · daily</div>
    <div class="datenav">
      <button data-act="dayprev" aria-label="前一天">‹</button>
      <div style="text-align:center"><button class="cur" data-act="opencal" style="background:none;border:none;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;padding:2px 6px">${fmtDate(day)} ▾</button>

      <button data-act="daynext" aria-label="後一天">›</button>
    </div>

    <div class="seclabel">今日收支 <span class="r">收 ${nt(dayInc)} · 支 ${nt(dayExp)}</span></div>
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <button class="expchip" data-act="settype" data-type="expense" style="flex:1;justify-content:center;${!isInc?"border-color:var(--now);color:var(--now);background:#DB4D3414":""}">支出</button>
      <button class="expchip" data-act="settype" data-type="income" style="flex:1;justify-content:center;${isInc?"border-color:var(--someday);color:var(--someday);background:#4F977E14":""}">收入</button>
    </div>
    <div class="expchips">${cats.map(c=>`<button class="expchip" data-act="setentrycat" data-cat="${c.key}"
        style="${curCat===c.key?`border-color:${c.color};color:${c.color};background:${c.color}14`:""}">
        <i style="background:${c.color}"></i>${c.label}</button>`).join("")}

    <div class="row" style="margin-bottom:6px">
      <input class="inp" id="expAmount" inputmode="numeric" placeholder="金額" style="flex:0 0 110px" value="${esc(ui.expAmount)}" />
      <input class="inp" id="expNote" placeholder="${isInc?"來源／備註（可空）":"買了什麼（可空）"}" value="${esc(ui.expNote)}" />
      <button class="btn" id="addExp">記</button>
    </div>
    ${dayAll.length?dayAll.map(e=>{const c=catOf(e);const inc=e.type==="income";return `
      <div class="exprow" data-act="editexp" data-id="${e.id}" style="cursor:pointer">
        <i style="width:11px;height:11px;border-radius:99px;background:${c.color};flex-shrink:0"></i>
        <div style="min-width:0"><div style="font-size:14.5px">${e.note?esc(e.note):c.label}</div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--sub)">${inc?"收入":"支出"} · ${c.label}</div></div>
        <div class="amt" style="color:${inc?'var(--someday)':'var(--ink)'}">${inc?"+":"−"}${nt(e.amount)}</div>
        <button class="del" data-act="askdel" data-kind="exp" data-id="${e.id}">✕</button>
      </div>`;}).join(""):`<div class="empty" style="padding:30px">今天還沒有收支紀錄。</div>`}

    <div class="seclabel">今日小記 ✍️ <button class="r today-btn" data-act="openjournal" style="font-size:12px">看本月小記 ›</button></div>
    <textarea class="inp" id="journal" placeholder="今天做了什麼、心情、想記下的事…">${esc(note)}</textarea>

    <div class="seclabel">本月結餘</div>
    <div class="statcard">
      <div class="row1"><div style="font-size:14px;color:var(--sub);font-weight:600">本月結餘</div>
        <div class="unit">${mon.replace("-",".")}</div></div>
      <div class="bignum" style="color:${net>=0?'var(--someday)':'var(--now)'}">${signed(net)}</div>
      <div style="display:flex;gap:18px;margin-top:8px;font-family:var(--mono);font-size:12.5px">
        <span style="color:var(--someday)">收入 ${nt(monInc)}</span>
        <span style="color:var(--now)">支出 ${nt(monExp)}</span>
      </div>
      ${byCat.length?`<div class="catbar">${byCat.map(c=>`<div title="${c.label}" style="width:${c.s/expT*100}%;background:${c.color}"></div>`).join("")}</div>
        <div class="legend">${byCat.map(c=>`<span><i style="background:${c.color}"></i>${c.label} ${nt(c.s)}</span>`).join("")}</div>`:""}
      <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;color:var(--sub);font-weight:600">目前總結餘（累積）</span>
        <span class="unit" style="font-size:15px;font-weight:700;color:${totalBal>=0?'var(--someday)':'var(--now)'}">${signed(totalBal)}</span>
      </div>
    </div>

    ${trendHTML}
  </section>`;

  // 日記自動存（不重繪，避免失焦）
  const j=document.getElementById("journal");
  j.oninput=e=>{state.journal[day]=e.target.value;save();};
  // 趨勢圖捲到當前月份
  const ts=document.getElementById("trendScroll");
  if(ts){const pmw=46,idx=+mon.slice(5)-1;ts.scrollLeft=Math.max(0,idx*pmw-ts.clientWidth/2+pmw/2);}
  // 支出輸入暫存（不重繪）
  const amt=document.getElementById("expAmount"), no=document.getElementById("expNote");
  amt.oninput=e=>{ui.expAmount=e.target.value;};
  no.oninput=e=>{ui.expNote=e.target.value;};
  const addE=()=>addEntry();
  document.getElementById("addExp").onclick=addE;
  amt.onkeydown=e=>{if(e.key==="Enter")addE();};
  no.onkeydown=e=>{if(e.key==="Enter")addE();};
}

function renderNav(){
  const plan=[["list","清單"],["cal","日"],["week","週"],["month","月"]];
  const btn=([k,l],rec)=>`<button class="navbtn ${rec?"rec ":""}${state.tab===k?"on":""}" data-act="tab" data-tab="${k}"><span>${l}</span>${state.tab===k?'<span class="navdot"></span>':""}</button>`;
  document.getElementById("nav").innerHTML=
    `<div class="navinner">${plan.map(p=>btn(p,false)).join("")}<span class="navsep"></span>${btn(["daily","帳本"],true)}</div>`;
}

        font-family:var(--mono);border:1.5px solid ${sel?'transparent':'var(--line)'};

      <div style="margin-top:12px">${entries.length?entries.map(e=>`
        <button data-act="jumpday" data-date="${e.ds}" style="display:block;width:100%;text-align:left;background:var(--surface);

    o.innerHTML=`<div class="sheetbg" data-act="closeoverlay"><div class="sheet" data-stop="1">
      <div class="lbl">${label}</div>
      <input class="inp" id="editInput" style="margin-top:10px" value="${esc(ui.editVal)}" />

    const inp=document.getElementById("editInput");
    inp.oninput=e=>ui.editVal=e.target.value;
    inp.onkeydown=e=>{if(e.key==="Enter")document.getElementById("editSave").click();};
    const due=document.getElementById("editDue");
    if(due) due.onchange=e=>{ui.editDue=e.target.value;renderOverlay();};
    const st=document.getElementById("editStart"); if(st) st.onchange=e=>{ui.editStart=e.target.value;};
    const en=document.getElementById("editEnd"); if(en) en.onchange=e=>{ui.editEnd=e.target.value;};
    document.getElementById("editSave").onclick=()=>saveEdit();
    setTimeout(()=>inp.focus(),50);
  } else if(ui.edit && ui.edit.kind==="exp"){
    const ee=ui.editExp, isInc=ee.type==="income", cats=catList(ee.type);
    o.innerHTML=`<div class="sheetbg" data-act="closeoverlay"><div class="sheet" data-stop="1">
      <div class="lbl">修改紀錄</div>
      <div style="display:flex;gap:6px;margin:10px 0 10px">
        <button class="expchip" data-act="edittype" data-type="expense" style="flex:1;justify-content:center;${!isInc?"border-color:var(--now);color:var(--now);background:#DB4D3414":""}">支出</button>
        <button class="expchip" data-act="edittype" data-type="income" style="flex:1;justify-content:center;${isInc?"border-color:var(--someday);color:var(--someday);background:#4F977E14":""}">收入</button>
      </div>
      <div class="expchips">${cats.map(c=>`<button class="expchip" data-act="editcat" data-cat="${c.key}" style="${ee.cat===c.key?`border-color:${c.color};color:${c.color};background:${c.color}14`:""}"><i style="background:${c.color}"></i>${c.label}</button>`).join("")}</div>
      <div class="row" style="margin-top:4px">
        <input class="inp" id="editAmt" inputmode="numeric" style="flex:0 0 120px" value="${esc(String(ee.amount))}" />
        <input class="inp" id="editNote" placeholder="備註（可空）" value="${esc(ee.note||"")}" />
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn ghost" data-act="sheetdone">取消</button>
        <button class="btn" id="editExpSave" style="flex:1">儲存</button>
      </div></div></div>`;
    document.getElementById("editAmt").oninput=e=>ui.editExp.amount=e.target.value;
    document.getElementById("editNote").oninput=e=>ui.editExp.note=e.target.value;
    document.getElementById("editExpSave").onclick=()=>saveEditExp();
  } else if(ui.catManage){
    const type=ui.entryType, list=catList(type), isInc=type==="income";
    o.innerHTML=`<div class="sheetbg" data-act="closeoverlay"><div class="sheet" data-stop="1">
      <div class="lbl">管理分類</div>
      <div style="display:flex;gap:6px;margin:10px 0 12px">
        <button class="expchip" data-act="catmtype" data-type="expense" style="flex:1;justify-content:center;${!isInc?"border-color:var(--now);color:var(--now);background:#DB4D3414":""}">支出分類</button>
        <button class="expchip" data-act="catmtype" data-type="income" style="flex:1;justify-content:center;${isInc?"border-color:var(--someday);color:var(--someday);background:#4F977E14":""}">收入分類</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">${list.map(c=>`
        <div class="exprow" style="cursor:default">
          <i style="width:12px;height:12px;border-radius:99px;background:${c.color};flex-shrink:0"></i>
          <div style="flex:1;font-size:14px">${esc(c.label)}</div>
          ${c.custom?`<button class="del" data-act="catdel" data-key="${c.key}">✕</button>`:`<span style="font-family:var(--mono);font-size:10px;color:var(--sub)">預設</span>`}
        </div>`).join("")}</div>
      <div class="lbl" style="margin:16px 0 8px">新增分類</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${CAT_PALETTE.map(col=>`<button data-act="catcolor" data-color="${col}" style="width:26px;height:26px;border-radius:99px;background:${col};border:3px solid ${ui.newCatColor===col?'var(--ink)':'transparent'};cursor:pointer"></button>`).join("")}</div>
      <div class="row">
        <input class="inp" id="newCat" placeholder="分類名稱" value="${esc(ui.newCatLabel)}" />
        <button class="btn" id="addCat">新增</button>
      </div></div></div>`;
    const nc=document.getElementById("newCat");
    nc.oninput=e=>ui.newCatLabel=e.target.value;
    nc.onkeydown=e=>{if(e.key==="Enter")document.getElementById("addCat").click();};
    document.getElementById("addCat").onclick=()=>addCat();
  } else if(ui.backup){
    const dump=JSON.stringify({v:1,tasks:state.tasks,week:state.week,monthGoals:state.monthGoals,expenses:state.expenses,journal:state.journal,cats:state.cats});
    o.innerHTML=`<div class="sheetbg" data-act="closeoverlay"><div class="sheet" data-stop="1">
      <div class="lbl">備份 / 還原</div>
      <p style="font-size:12.5px;color:var(--sub);line-height:1.6;margin:8px 0 12px">資料只存在這支裝置。複製或下載下面這段就是完整備份；要還原時貼到下方再按「匯入」。</p>
      <textarea class="inp" id="dumpBox" readonly style="min-height:90px;font-family:var(--mono);font-size:11px">${esc(dump)}</textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost" id="copyDump" style="flex:1">複製</button>
        <button class="btn ghost" id="dlDump" style="flex:1">下載檔案</button>
      </div>
      <div class="lbl" style="margin:18px 0 8px">匯入（會覆蓋現有資料）</div>
      <textarea class="inp" id="impBox" placeholder="貼上備份內容…" style="min-height:70px;font-family:var(--mono);font-size:11px"></textarea>
      <button class="btn" id="impBtn" style="width:100%;margin-top:8px">匯入並覆蓋</button>
    </div></div>`;
    document.getElementById("copyDump").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(dump);const b=document.getElementById("copyDump");b.textContent="已複製";setTimeout(()=>b.textContent="複製",1200);};
    document.getElementById("dlDump").onclick=()=>{const blob=new Blob([dump],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`planner-backup-${todayStr()}.json`;a.click();};
    const ib=document.getElementById("impBox");ib.oninput=e=>ui.importText=e.target.value;
    document.getElementById("impBtn").onclick=()=>doImport();
  } else if(ui.blobPick){
    const base=state.blobColor||"#7CB6A0";
    const moods=["content","happy","excited","sleepy"];
    o.innerHTML=`<div class="sheetbg" data-act="closeoverlay"><div class="sheet" data-stop="1">
      <div class="lbl">換個顏色 — 用你喜歡角色的代表色</div>
      <div style="display:flex;justify-content:center;gap:14px;margin:14px 0 4px">
        ${moods.map(m=>`<div style="width:46px;height:46px">${blobSVG(m)}</div>`).join("")}
      </div>
      <div style="text-align:center;font-family:var(--mono);font-size:10px;color:var(--sub);margin-bottom:14px">平常 · 開心 · 超開心 · 想睡</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px">
        ${BLOB_PALETTE.map(col=>`<button data-act="blobcolor" data-color="${col}" style="width:34px;height:34px;border-radius:99px;background:${col};border:3px solid ${base.toLowerCase()===col.toLowerCase()?'var(--ink)':'#fff'};box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:pointer"></button>`).join("")}
      </div>
      <div class="lbl" style="margin-bottom:6px">或直接填色碼（角色代表色）</div>
      <div class="row">
        <input class="inp" id="blobHex" value="${esc(base)}" placeholder="#7CB6A0" />
        <button class="btn" id="blobHexApply">套用</button>
      </div>
    </div></div>`;
    const applyHex=()=>{const v=document.getElementById("blobHex").value.trim();const h=/^#?[0-9a-fA-F]{6}$/.test(v)?(v[0]==="#"?v:"#"+v):null;if(h){state.blobColor=h;save();ui.blobPick=false;rerender();toast("換好顏色了");}else{toast("色碼格式怪怪的，例如 #7CB6A0");}};
    document.getElementById("blobHexApply").onclick=applyHex;
    document.getElementById("blobHex").onkeydown=e=>{if(e.key==="Enter")applyHex();};
  } else { o.innerHTML=""; }
}

function renderDialog(){
  const d=document.getElementById("dialog");
  if(!ui.confirm){d.innerHTML="";return;}
  d.innerHTML=`<div class="dlgbg" data-act="confirmno"><div class="dlg" data-stop="1">
    <h3>確定刪除？</h3>
    <p>${esc(ui.confirm.text)}</p>
    <div class="row">
      <button class="btn ghost" data-act="confirmno">取消</button>
      <button class="btn danger" data-act="confirmyes">刪除</button>
    </div></div></div>`;
}

/* ---------- 動作 ---------- */
let _toastT=null;
function toast(msg){
  const el=document.getElementById("toast");
  el.innerHTML=`<div class="t">${esc(msg)}</div>`;
  const t=el.firstChild;
  requestAnimationFrame(()=>t.classList.add("show"));
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>{t.classList.remove("show");setTimeout(()=>{el.innerHTML="";},250);},1800);
}
function rerender(){
  renderStrip(); renderHeader(); renderNav();
  if(state.tab==="list")renderList();
  else if(state.tab==="cal")renderCal();
  else if(state.tab==="week")renderWeek();
  else if(state.tab==="month")renderMonth();
  else renderDaily();
  renderOverlay(); renderDialog(); save();
}
function bindAdd(inputId,btnId,fn){
  const i=document.getElementById(inputId),b=document.getElementById(btnId);
  if(!i||!b)return;
  b.onclick=()=>fn(i.value);
  i.onkeydown=e=>{if(e.key==="Enter")fn(i.value);};
}
function addTask(v){v=v.trim();if(!v)return;
  state.tasks.unshift({id:uid(),text:v,category:ui.filter==="all"?"someday":ui.filter});rerender();}
function addToday(v){v=v.trim();if(!v)return;
  state.tasks.unshift({id:uid(),text:v,category:"now",due:todayStr()});rerender();}
function addMonth(v){v=v.trim();if(!v)return;const m=ui.planMonth||CURMON;state.monthGoals[m]=[...(state.monthGoals[m]||[]),{id:uid(),text:v,done:false}];rerender();}
function addEntry(){
  const amt=parseFloat(ui.expAmount);
  if(!amt||amt<=0||isNaN(amt))return;
  const type=ui.entryType;
  const cat=type==="income"?ui.incCat:ui.expCat;
  state.expenses.unshift({id:uid(),date:ui.day,type,amount:amt,cat,note:(ui.expNote||"").trim()});
  ui.expAmount="";ui.expNote="";rerender();
  toast(type==="income"?`入帳 +${nt(amt)} 💪`:`記下 −${nt(amt)}`);
  blobReact();
}
function saveCell(v){const{day,h0}=ui.cell;const end=ui.cellEnd||h0+(ui.cell.span||1);v=(v||"").trim();
  for(let h=h0;h<end;h++){const key=`${day}-${h}`;if(v)state.week[key]=v;else delete state.week[key];}
  ui.cell=null;ui.cellVal="";ui.cellEnd=0;rerender();}
function doDelete(){
  const c=ui.confirm;if(!c)return;
  if(c.kind==="task")state.tasks=state.tasks.filter(t=>t.id!==c.id);
  else if(c.kind==="month"){const m=ui.planMonth||CURMON;state.monthGoals[m]=(state.monthGoals[m]||[]).filter(g=>g.id!==c.id);}
  else if(c.kind==="exp")state.expenses=state.expenses.filter(e=>e.id!==c.id);
  ui.confirm=null;rerender();
}
function findText(kind,id){
  if(kind==="task")return(state.tasks.find(t=>t.id===id)||{}).text||"";
  if(kind==="month")return((state.monthGoals[ui.planMonth||CURMON]||[]).find(g=>g.id===id)||{}).text||"";
  if(kind==="exp"){const e=state.expenses.find(x=>x.id===id);return e?`${e.type==="income"?"收入":"支出"} · ${catOf(e).label} ${nt(e.amount)}${e.note?" · "+e.note:""}`:"";}
  return "";
}
function saveEdit(){
  const v=(ui.editVal||"").trim();const{kind,id}=ui.edit;
  if(v){
    if(kind==="task"){const due=ui.editDue||null;const start=due?(ui.editStart||null):null;const end=due?(ui.editEnd||null):null;
      state.tasks=state.tasks.map(t=>t.id===id?{...t,text:v,emoji:ui.editEmoji||"",due,start,end}:t);}
    else if(kind==="month"){const m=ui.planMonth||CURMON;state.monthGoals[m]=(state.monthGoals[m]||[]).map(g=>g.id===id?{...g,text:v}:g);}
  }
  ui.edit=null;ui.editVal="";ui.editEmoji="";ui.editDue="";ui.editStart="";ui.editEnd="";rerender();
}
function saveEditExp(){
  const ee=ui.editExp;const amt=parseFloat(ee.amount);
  if(amt&&amt>0&&!isNaN(amt)){
    state.expenses=state.expenses.map(x=>x.id===ee.id?{...x,type:ee.type,cat:ee.cat,amount:amt,note:(ee.note||"").trim()}:x);
  }
  ui.edit=null;ui.editExp=null;rerender();
}
function addCat(){
  const label=(ui.newCatLabel||"").trim();if(!label)return;
  const type=ui.entryType;const key="c"+uid();
  state.cats[type]=[...state.cats[type],{key,label,color:ui.newCatColor,custom:true}];
  ui.newCatLabel="";renderOverlay();save();
}
function doImport(){
  try{
    const d=JSON.parse(ui.importText||"");
    if(d.tasks)state.tasks=d.tasks;
    if(d.week)state.week=d.week;
    if(d.monthGoals)state.monthGoals=d.monthGoals;
    if(d.expenses)state.expenses=d.expenses;
    if(d.journal)state.journal=d.journal;
    if(d.cats)state.cats=d.cats;
    ui.backup=false;ui.importText="";rerender();
  }catch(err){alert("匯入失敗：格式不正確");}
}

document.addEventListener("click",e=>{
  const stop=e.target.closest("[data-stop]");
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case "tab": state.tab=el.dataset.tab; ui.picking=null; rerender(); break;
    case "filter": ui.filter=el.dataset.cat; rerender(); break;
    case "pickopen": ui.picking=id; rerender(); break;
    case "setcat": state.tasks=state.tasks.map(t=>t.id===id?{...t,category:el.dataset.cat}:t); ui.picking=null; rerender(); break;
    case "edittask": {const t=state.tasks.find(x=>x.id===id)||{};ui.edit={kind:"task",id};ui.editVal=t.text||"";ui.editEmoji=t.emoji||"";ui.editDue=t.due||"";ui.editStart=t.start||"";ui.editEnd=t.end||"";renderOverlay();break;}
    case "editemoji": ui.editEmoji=(ui.editEmoji===el.dataset.e?"":el.dataset.e); renderOverlay(); break;
    case "editduetoday": ui.editDue=todayStr(); renderOverlay(); break;
    case "editdueclear": ui.editDue=""; renderOverlay(); break;
    case "donetoday": {state.tasks=state.tasks.filter(x=>x.id!==id);rerender();toast("完成 ✓");blobReact();break;}
    case "caltabday": ui.calTabDay=el.dataset.date; rerender(); break;
    case "caltabprev": ui.calTabMonth=addMonths(ui.calTabMonth||todayStr().slice(0,7),-1); rerender(); break;
    case "caltabnext": ui.calTabMonth=addMonths(ui.calTabMonth||todayStr().slice(0,7),1); rerender(); break;
    case "caltabtoday": ui.calTabMonth=todayStr().slice(0,7); ui.calTabDay=todayStr(); rerender(); break;
    case "editgoal": ui.edit={kind:"month",id}; ui.editVal=((state.monthGoals[ui.planMonth||CURMON]||[]).find(g=>g.id===id)||{}).text||""; renderOverlay(); break;
    case "editexp": {const ex=state.expenses.find(x=>x.id===id);if(ex){ui.edit={kind:"exp",id};ui.editExp={id,type:ex.type||"expense",cat:ex.cat,amount:ex.amount,note:ex.note||""};renderOverlay();}break;}
    case "edittype": {ui.editExp.type=el.dataset.type;ui.editExp.cat=catList(el.dataset.type)[0].key;renderOverlay();break;}
    case "editcat": ui.editExp.cat=el.dataset.cat; renderOverlay(); break;
    case "catmanage": ui.catManage=true; renderOverlay(); break;
    case "catmtype": ui.entryType=el.dataset.type; if(ui.entryType==="income")ui.incCat=catList("income")[0].key; else ui.expCat=catList("expense")[0].key; renderOverlay(); break;
    case "catcolor": ui.newCatColor=el.dataset.color; renderOverlay(); break;
    case "catdel": {const type=ui.entryType;state.cats[type]=state.cats[type].filter(c=>c.key!==el.dataset.key);if(ui.expCat===el.dataset.key)ui.expCat=catList("expense")[0].key;if(ui.incCat===el.dataset.key)ui.incCat=catList("income")[0].key;save();renderOverlay();break;}
    case "openbackup": ui.backup=true; renderOverlay(); break;
    case "cell": {const d=+el.dataset.day,h0=+el.dataset.h0,span=+el.dataset.span;ui.cell={day:d,h0,span};ui.cellEnd=h0+span;ui.cellVal=state.week[`${d}-${h0}`]||"";renderOverlay();break;}
    case "cellpick": ui.cellVal=el.dataset.text; renderOverlay(); break;
    case "cellclear": saveCell(""); break;
    case "mtoggle": {const m=ui.planMonth||CURMON;const was=(state.monthGoals[m]||[]).find(g=>g.id===id);const becameDone=was&&!was.done;state.monthGoals[m]=(state.monthGoals[m]||[]).map(g=>g.id===id?{...g,done:!g.done}:g);rerender();if(becameDone){const left=state.monthGoals[m].filter(g=>!g.done).length;toast(left===0?"本月清空了 🎉 太強":"完成一件 ✓");blobReact();}break;}
    case "mpick": {const m=ui.planMonth||CURMON;state.monthGoals[m]=[...(state.monthGoals[m]||[]),{id:uid(),text:el.dataset.text,done:false}];save();renderOverlay();break;}
    case "planpickopen": ui.planPick=true; ui.planPickYear=+(ui.planMonth||CURMON).slice(0,4); renderOverlay(); break;
    case "planyearprev": ui.planPickYear=(ui.planPickYear||+(ui.planMonth||CURMON).slice(0,4))-1; renderOverlay(); break;
    case "planyearnext": ui.planPickYear=(ui.planPickYear||+(ui.planMonth||CURMON).slice(0,4))+1; renderOverlay(); break;
    case "plansetmonth": ui.planMonth=`${ui.planPickYear}-${el.dataset.m}`; ui.planPick=false; rerender(); break;
    case "dayprev": ui.day=addDays(ui.day,-1); rerender(); break;
    case "daynext": ui.day=addDays(ui.day,1); rerender(); break;
    case "daytoday": ui.day=todayStr(); rerender(); break;
    case "monthjump": ui.day=el.dataset.date; rerender(); break;
    case "openjournal": ui.journalView=true; ui.journalPick=false; ui.journalMonth=ui.day.slice(0,7); renderOverlay(); break;
    case "jpickopen": ui.journalPick=true; ui.journalPickYear=+(ui.journalMonth||ui.day.slice(0,7)).slice(0,4); renderOverlay(); break;
    case "jyearprev": ui.journalPickYear=(ui.journalPickYear||+(ui.journalMonth||ui.day).slice(0,4))-1; renderOverlay(); break;
    case "jyearnext": ui.journalPickYear=(ui.journalPickYear||+(ui.journalMonth||ui.day).slice(0,4))+1; renderOverlay(); break;
    case "jsetmonth": ui.journalMonth=`${ui.journalPickYear}-${el.dataset.m}`; ui.journalPick=false; renderOverlay(); break;
    case "jback": ui.journalPick=false; renderOverlay(); break;
    case "jumpday": ui.day=el.dataset.date; ui.journalView=false; rerender(); break;
    case "opencal": ui.calView=true; ui.calPickMode=false; ui.calMonth=ui.day.slice(0,7); renderOverlay(); break;
    case "calprev": ui.calMonth=addMonths(ui.calMonth||ui.day.slice(0,7),-1); renderOverlay(); break;
    case "calnext": ui.calMonth=addMonths(ui.calMonth||ui.day.slice(0,7),1); renderOverlay(); break;
    case "calpick": ui.day=el.dataset.date; ui.calView=false; ui.calPickMode=false; rerender(); break;
    case "caltoday": ui.day=todayStr(); ui.calView=false; ui.calPickMode=false; rerender(); break;
    case "calpickopen": ui.calPickMode=true; ui.calPickYear=+(ui.calMonth||ui.day.slice(0,7)).slice(0,4); renderOverlay(); break;
    case "blobtap": ui.blobPick=true; renderOverlay(); break;
    case "blobcolor": state.blobColor=el.dataset.color; save(); ui.blobPick=false; rerender(); toast("換好顏色了"); break;
    case "calyearprev": ui.calPickYear=(ui.calPickYear||+(ui.calMonth||ui.day).slice(0,4))-1; renderOverlay(); break;
    case "calyearnext": ui.calPickYear=(ui.calPickYear||+(ui.calMonth||ui.day).slice(0,4))+1; renderOverlay(); break;
    case "calsetmonth": ui.calMonth=`${ui.calPickYear}-${el.dataset.m}`; ui.calPickMode=false; renderOverlay(); break;
    case "calbackday": ui.calPickMode=false; renderOverlay(); break;
    case "settype": ui.entryType=el.dataset.type; renderDaily(); break;
    case "setentrycat": if(ui.entryType==="income")ui.incCat=el.dataset.cat; else ui.expCat=el.dataset.cat; renderDaily(); break;
    case "askdel": ui.confirm={kind:el.dataset.kind,id,text:findText(el.dataset.kind,id)}; renderDialog(); break;
    case "confirmyes": doDelete(); break;
    case "confirmno": ui.confirm=null; renderDialog(); break;
    case "closeoverlay": if(!stop){ui.cell=null;ui.cellEnd=0;ui.edit=null;ui.editExp=null;ui.catManage=false;ui.backup=false;ui.monthPicker=false;ui.planPick=false;ui.journalView=false;ui.journalPick=false;ui.calView=false;ui.calPickMode=false;ui.blobPick=false;ui.todoCal=false;ui.todoDay="";ui.editEmoji="";ui.editDue="";ui.editStart="";ui.editEnd="";ui.cellVal="";rerender();} break;
    case "sheetdone": ui.cell=null;ui.cellEnd=0;ui.edit=null;ui.editExp=null;ui.catManage=false;ui.backup=false;ui.monthPicker=false;ui.planPick=false;ui.journalView=false;ui.journalPick=false;ui.calView=false;ui.calPickMode=false;ui.blobPick=false;ui.todoCal=false;ui.todoDay="";ui.editEmoji="";ui.editDue="";ui.editStart="";ui.editEnd="";ui.cellVal="";rerender(); break;
  }
});

rerender();
</script>
</body>
</html>
